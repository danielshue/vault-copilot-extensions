<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f4c81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a9b8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#c8f0ea;stop-opacity:0.85" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)" />

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="80" ry="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Document shape -->
  <g filter="url(#shadow)">
    <path d="M148 110 L308 110 L364 166 L364 402 L148 402 Z" rx="10" fill="url(#docGrad)" opacity="0.95" />
    <path d="M308 110 L308 166 L364 166 Z" fill="rgba(26,155,138,0.4)" />
  </g>

  <!-- Mermaid diagram nodes inside document -->
  <!-- Node A (top) -->
  <rect x="210" y="158" width="76" height="34" rx="8" fill="#1a9b8a" opacity="0.9" />
  <text x="248" y="180" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">A</text>

  <!-- Arrow A -> B -->
  <line x1="248" y1="192" x2="218" y2="222" stroke="rgba(15,76,129,0.75)" stroke-width="3" stroke-linecap="round" />
  <polygon points="212,232 216,218 226,224" fill="rgba(15,76,129,0.75)" />

  <!-- Arrow A -> C -->
  <line x1="248" y1="192" x2="278" y2="222" stroke="rgba(15,76,129,0.75)" stroke-width="3" stroke-linecap="round" />
  <polygon points="284,232 282,218 272,224" fill="rgba(15,76,129,0.75)" />

  <!-- Node B (bottom left) -->
  <rect x="172" y="232" width="76" height="34" rx="8" fill="#0f6fa3" opacity="0.85" />
  <text x="210" y="254" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">B</text>

  <!-- Node C (bottom right) -->
  <rect x="248" y="232" width="76" height="34" rx="8" fill="#0f6fa3" opacity="0.85" />
  <text x="286" y="254" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">C</text>

  <!-- Arrow B -> D -->
  <line x1="210" y1="266" x2="248" y2="296" stroke="rgba(15,76,129,0.75)" stroke-width="3" stroke-linecap="round" />
  <polygon points="248,308 242,294 254,294" fill="rgba(15,76,129,0.75)" />

  <!-- Node D (bottom center) -->
  <rect x="210" y="308" width="76" height="34" rx="8" fill="#1a9b8a" opacity="0.9" />
  <text x="248" y="330" text-anchor="middle" font-family="monospace" font-size="13" fill="white" font-weight="bold">D</text>

  <!-- Arrow C -> D -->
  <line x1="286" y1="266" x2="266" y2="296" stroke="rgba(15,76,129,0.75)" stroke-width="3" stroke-linecap="round" />

  <!-- Small decorative lines (document text lines at bottom) -->
  <rect x="175" y="368" width="100" height="6" rx="3" fill="rgba(26,155,138,0.35)" />
  <rect x="175" y="382" width="70" height="6" rx="3" fill="rgba(26,155,138,0.25)" />

  <!-- Decorative accent dot top-right -->
  <circle cx="390" cy="122" r="22" fill="rgba(255,255,255,0.12)" />
  <circle cx="390" cy="122" r="10" fill="rgba(255,255,255,0.22)" />
</svg>