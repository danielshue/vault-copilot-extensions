<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)"/>
  <rect width="512" height="512" rx="80" ry="80" fill="url(#shine)"/>

  <!-- Robot/Agent head -->
  <rect x="156" y="148" width="200" height="180" rx="32" ry="32" fill="none" stroke="white" stroke-width="20" stroke-linejoin="round"/>

  <!-- Eyes -->
  <circle cx="216" cy="222" r="18" fill="white"/>
  <circle cx="296" cy="222" r="18" fill="white"/>
  <circle cx="216" cy="222" r="8" fill="#7C3AED"/>
  <circle cx="296" cy="222" r="8" fill="#7C3AED"/>

  <!-- Mouth / code line -->
  <rect x="196" y="274" width="120" height="14" rx="7" fill="white" opacity="0.85"/>

  <!-- Antenna -->
  <line x1="256" y1="148" x2="256" y2="100" stroke="white" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="88" r="18" fill="white"/>
  <circle cx="256" cy="88" r="9" fill="#7C3AED"/>

  <!-- Body / document base -->
  <rect x="186" y="328" width="140" height="14" rx="7" fill="white" opacity="0.6"/>

  <!-- Neck connector -->
  <rect x="236" y="328" width="40" height="18" rx="4" fill="white" opacity="0.5"/>

  <!-- Bracket left - code symbol -->
  <text x="108" y="290" font-family="monospace" font-size="72" fill="white" opacity="0.35" font-weight="bold">{</text>
  <!-- Bracket right -->
  <text x="362" y="290" font-family="monospace" font-size="72" fill="white" opacity="0.35" font-weight="bold">}</text>

  <!-- Sparkle top-right -->
  <g opacity="0.7">
    <line x1="390" y1="120" x2="390" y2="148" stroke="white" stroke-width="6" stroke-linecap="round"/>
    <line x1="376" y1="134" x2="404" y2="134" stroke="white" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- Sparkle bottom-left -->
  <g opacity="0.5">
    <line x1="128" y1="370" x2="128" y2="392" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <line x1="117" y1="381" x2="139" y2="381" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>