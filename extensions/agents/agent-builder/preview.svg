<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Agent Builder icon">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.55" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shine" x1="140" y1="96" x2="372" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="clipR">
      <rect x="32" y="32" width="448" height="448" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipR)">
    <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>
    <path d="M86 120C140 70 224 66 278 104C336 145 402 142 460 98V260C400 305 326 305 270 264C212 221 150 220 86 252V120Z" fill="url(#shine)"/>
    <circle cx="430" cy="112" r="78" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="108" cy="420" r="96" fill="#000000" opacity="0.06"/>
  </g>

  <g filter="url(#softShadow)">
    <!-- Gear -->
    <g transform="translate(280, 140)">
      <circle cx="0" cy="0" r="72" fill="none" stroke="#FFFFFF" stroke-width="16" opacity="0.9"/>
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" opacity="0.9"/>
      <!-- Gear teeth -->
      <rect x="-10" y="-90" width="20" height="24" rx="4" fill="#FFFFFF" opacity="0.9"/>
      <rect x="-10" y="66" width="20" height="24" rx="4" fill="#FFFFFF" opacity="0.9"/>
      <rect x="-90" y="-10" width="24" height="20" rx="4" fill="#FFFFFF" opacity="0.9"/>
      <rect x="66" y="-10" width="24" height="20" rx="4" fill="#FFFFFF" opacity="0.9"/>
      <rect x="50" y="-66" width="20" height="24" rx="4" fill="#FFFFFF" opacity="0.9" transform="rotate(45, 60, -54)"/>
      <rect x="-70" y="42" width="20" height="24" rx="4" fill="#FFFFFF" opacity="0.9" transform="rotate(45, -60, 54)"/>
      <rect x="50" y="42" width="20" height="24" rx="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-45, 60, 54)"/>
      <rect x="-70" y="-66" width="20" height="24" rx="4" fill="#FFFFFF" opacity="0.9" transform="rotate(-45, -60, -54)"/>
    </g>

    <!-- Document/Agent file -->
    <g transform="translate(0,2)">
      <path d="M120 220H280C290 220 298 228 298 238V420C298 430 290 438 280 438H120C110 438 102 430 102 420V238C102 228 110 220 120 220Z" fill="#FFFFFF" opacity="0.95"/>
      <!-- Document lines -->
      <g fill="none" stroke="#059669" stroke-opacity="0.3" stroke-width="10" stroke-linecap="round">
        <path d="M136 270H264"/>
        <path d="M136 310H250"/>
        <path d="M136 350H236"/>
        <path d="M136 390H220"/>
      </g>
      <!-- White line overlay -->
      <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
        <path d="M134 270H262"/>
        <path d="M134 310H248"/>
        <path d="M134 350H234"/>
        <path d="M134 390H218"/>
      </g>
    </g>

    <!-- Wrench -->
    <g transform="translate(320, 310) rotate(-45)">
      <rect x="-14" y="-70" width="28" height="120" rx="8" fill="#FFFFFF" opacity="0.9"/>
      <path d="M-24 42 L-14 20 L14 20 L24 42 Q24 66 0 66 Q-24 66 -24 42Z" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="0" cy="44" r="8" fill="#059669" opacity="0.3"/>
    </g>
  </g>

  <path d="M32 352C128 410 210 430 304 416C384 404 434 374 480 332V480H32V352Z" fill="#000000" opacity="0.06" clip-path="url(#clipR)"/>
</svg>
