<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f9b8e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a6b9a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#d0f0ec;stop-opacity:0.85" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" ry="80" fill="url(#bg)" />

  <!-- Document base -->
  <rect x="140" y="100" width="200" height="260" rx="14" ry="14" fill="url(#docGrad)" opacity="0.97" />

  <!-- Folded corner -->
  <polygon points="298,100 340,142 298,142" fill="#0f9b8e" opacity="0.5" />
  <polygon points="298,100 340,142 298,142" fill="#ffffff" opacity="0.3" />

  <!-- Document lines (text representation) -->
  <rect x="164" y="165" width="112" height="8" rx="4" fill="#1a6b9a" opacity="0.35" />
  <rect x="164" y="185" width="136" height="8" rx="4" fill="#1a6b9a" opacity="0.25" />

  <!-- Mermaid diagram: flowchart nodes -->
  <!-- Node A -->
  <rect x="168" y="210" width="48" height="26" rx="6" fill="#0f9b8e" opacity="0.85" />
  <text x="192" y="228" text-anchor="middle" font-size="11" fill="#ffffff" font-family="monospace" font-weight="bold">A</text>

  <!-- Node B -->
  <rect x="264" y="210" width="48" height="26" rx="6" fill="#1a6b9a" opacity="0.85" />
  <text x="288" y="228" text-anchor="middle" font-size="11" fill="#ffffff" font-family="monospace" font-weight="bold">B</text>

  <!-- Arrow A→B -->
  <line x1="216" y1="223" x2="261" y2="223" stroke="#444" stroke-width="2.5" opacity="0.5" />
  <polygon points="261,219 270,223 261,227" fill="#444" opacity="0.5" />

  <!-- Node C (below, centered) -->
  <rect x="216" y="258" width="48" height="26" rx="6" fill="#6c5ce7" opacity="0.75" />
  <text x="240" y="276" text-anchor="middle" font-size="11" fill="#ffffff" font-family="monospace" font-weight="bold">C</text>

  <!-- Arrow A→C -->
  <line x1="192" y1="236" x2="232" y2="258" stroke="#444" stroke-width="2" opacity="0.4" />
  <!-- Arrow B→C -->
  <line x1="288" y1="236" x2="252" y2="258" stroke="#444" stroke-width="2" opacity="0.4" />

  <!-- Bottom line -->
  <rect x="164" y="305" width="100" height="7" rx="3.5" fill="#1a6b9a" opacity="0.2" />
  <rect x="164" y="321" width="76" height="7" rx="3.5" fill="#1a6b9a" opacity="0.15" />

  <!-- Decorative orbiting dots -->
  <circle cx="390" cy="155" r="14" fill="#ffffff" opacity="0.12" />
  <circle cx="118" cy="370" r="20" fill="#ffffff" opacity="0.08" />
  <circle cx="400" cy="360" r="10" fill="#ffffff" opacity="0.10" />

  <!-- Mermaid-style "branch" accent top-right -->
  <circle cx="390" cy="128" r="7" fill="#ffffff" opacity="0.22" />
  <circle cx="415" cy="148" r="5" fill="#ffffff" opacity="0.16" />
  <line x1="390" y1="128" x2="415" y2="148" stroke="#ffffff" stroke-width="1.5" opacity="0.18" />
</svg>