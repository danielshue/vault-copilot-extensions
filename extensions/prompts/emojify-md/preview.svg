<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f7971e"/>
      <stop offset="100%" style="stop-color:#e040fb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.18"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#shine)"/>

  <!-- Smiley face base -->
  <circle cx="256" cy="248" r="138" fill="none" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Eyes -->
  <circle cx="210" cy="214" r="18" fill="white"/>
  <circle cx="302" cy="214" r="18" fill="white"/>
  <!-- Smile -->
  <path d="M192 278 Q256 346 320 278" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small sparkle top-right of face -->
  <g transform="translate(340,128)" fill="white" opacity="0.9">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" />
  </g>
  <!-- Small sparkle bottom-left -->
  <g transform="translate(148,358)" fill="white" opacity="0.65">
    <polygon points="0,-11 2.5,-2.5 11,0 2.5,2.5 0,11 -2.5,2.5 -11,0 -2.5,-2.5" />
  </g>
  <!-- Small sparkle top-left -->
  <g transform="translate(172,118)" fill="white" opacity="0.5">
    <polygon points="0,-9 2,-2 9,0 2,2 0,9 -2,2 -9,0 -2,-2" />
  </g>

  <!-- Text cursor / magic wand hint at bottom -->
  <rect x="219" y="388" width="74" height="16" rx="8" fill="white" opacity="0.85"/>
  <rect x="240" y="376" width="32" height="8" rx="4" fill="white" opacity="0.5"/>
</svg>