<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Daily Note Automation icon">
  <defs>
    <linearGradient id="bg" x1="64" y1="48" x2="448" y2="464" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.55" stop-color="#D97706"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="shine" x1="140" y1="96" x2="372" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="clipR">
      <rect x="32" y="32" width="448" height="448" rx="96" ry="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clipR)">
    <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>
    <path d="M86 120C140 70 224 66 278 104C336 145 402 142 460 98V260C400 305 326 305 270 264C212 221 150 220 86 252V120Z" fill="url(#shine)"/>
    <circle cx="430" cy="112" r="78" fill="#FFFFFF" opacity="0.08"/>
    <circle cx="108" cy="420" r="96" fill="#000000" opacity="0.06"/>
  </g>

  <g filter="url(#softShadow)">
    <!-- Calendar/Note page -->
    <g transform="translate(0,2)">
      <path d="M110 180H300C310 180 318 188 318 198V420C318 430 310 438 300 438H110C100 438 92 430 92 420V198C92 188 100 180 110 180Z" fill="#FFFFFF" opacity="0.95"/>
      <!-- Calendar header bar -->
      <rect x="92" y="180" width="226" height="52" rx="16" fill="#FDE68A" opacity="0.9"/>
      <!-- Calendar dots -->
      <circle cx="140" cy="206" r="8" fill="#D97706" opacity="0.4"/>
      <circle cx="176" cy="206" r="8" fill="#D97706" opacity="0.4"/>
      <circle cx="212" cy="206" r="8" fill="#D97706" opacity="0.4"/>
      <!-- Document lines -->
      <g fill="none" stroke="#D97706" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round">
        <path d="M126 270H280"/>
        <path d="M126 310H264"/>
        <path d="M126 350H248"/>
        <path d="M126 390H230"/>
      </g>
      <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
        <path d="M124 270H278"/>
        <path d="M124 310H262"/>
        <path d="M124 350H246"/>
        <path d="M124 390H228"/>
      </g>
    </g>

    <!-- Clock -->
    <g transform="translate(360, 300)">
      <circle cx="0" cy="0" r="80" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#FDE68A" stroke-width="8"/>
      <!-- Hour markers -->
      <line x1="0" y1="-68" x2="0" y2="-58" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="58" x2="0" y2="68" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="-68" y1="0" x2="-58" y2="0" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
      <line x1="58" y1="0" x2="68" y2="0" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>
      <!-- Hour hand -->
      <line x1="0" y1="0" x2="0" y2="-46" stroke="#D97706" stroke-width="8" stroke-linecap="round"/>
      <!-- Minute hand -->
      <line x1="0" y1="0" x2="34" y2="-34" stroke="#D97706" stroke-width="6" stroke-linecap="round"/>
      <!-- Center dot -->
      <circle cx="0" cy="0" r="6" fill="#D97706"/>
    </g>

    <!-- Circular arrows (automation/repeat) -->
    <g transform="translate(360, 160)">
      <path d="M-30 0 A30 30 0 1 1 0 30" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
      <polygon points="4,18 -8,34 16,34" fill="#FFFFFF" opacity="0.9"/>
      <path d="M30 0 A30 30 0 1 1 0 -30" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
      <polygon points="-4,-18 8,-34 -16,-34" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <path d="M32 352C128 410 210 430 304 416C384 404 434 374 480 332V480H32V352Z" fill="#000000" opacity="0.06" clip-path="url(#clipR)"/>
</svg>
